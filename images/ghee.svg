<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#FBF8F2"/>
      <stop offset="70%" stop-color="#F1E8D9"/>
      <stop offset="100%" stop-color="#E5D8C3"/>
    </radialGradient>
    <linearGradient id="jarGlass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.8"/>
      <stop offset="20%" stop-color="#FDF8E8" stop-opacity="0.4"/>
      <stop offset="80%" stop-color="#EED596" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#D4AA4F" stop-opacity="0.8"/>
    </linearGradient>
    <linearGradient id="gheeLiquid" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F6D365"/>
      <stop offset="35%" stop-color="#E5A93C"/>
      <stop offset="70%" stop-color="#C88825"/>
      <stop offset="100%" stop-color="#9C6212"/>
    </linearGradient>
    <linearGradient id="brassLid" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#C59B4B"/>
      <stop offset="30%" stop-color="#F3DC9B"/>
      <stop offset="70%" stop-color="#D8A84E"/>
      <stop offset="100%" stop-color="#8F631D"/>
    </linearGradient>
    <linearGradient id="labelBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FAF5EC"/>
      <stop offset="100%" stop-color="#EFE4D2"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="16" flood-color="#3D2418" flood-opacity="0.14"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="600" height="600" rx="32" fill="url(#bgGlow)"/>

  <!-- Subtle Artisanal Background Geometry -->
  <circle cx="300" cy="310" r="210" fill="#EBDDC5" fill-opacity="0.45"/>
  <circle cx="300" cy="310" r="180" fill="none" stroke="#C89B48" stroke-width="1.5" stroke-dasharray="6 6" stroke-opacity="0.4"/>

  <!-- Shadow below the jar -->
  <ellipse cx="300" cy="485" rx="140" ry="24" fill="#2E1B10" fill-opacity="0.18" filter="blur(8px)"/>

  <!-- Ghee Jar Group -->
  <g filter="url(#softShadow)">
    <!-- Jar Body Back -->
    <path d="M210,210 L390,210 C415,210 435,230 435,260 L430,420 C430,455 405,475 370,475 L230,475 C195,475 170,455 170,420 L165,260 C165,230 185,210 210,210 Z" fill="#F8E5BD"/>

    <!-- Ghee Content (Rich Golden Liquid) -->
    <path d="M172,275 C172,275 220,265 300,265 C380,265 428,275 428,275 L424,415 C424,448 400,468 368,468 L232,468 C200,468 176,448 176,415 Z" fill="url(#gheeLiquid)"/>

    <!-- Golden Granular / Ghee Shimmer Texture -->
    <ellipse cx="250" cy="330" rx="35" ry="12" fill="#FFEAA7" fill-opacity="0.4"/>
    <ellipse cx="350" cy="370" rx="45" ry="15" fill="#FFEAA7" fill-opacity="0.25"/>
    <circle cx="280" cy="390" r="8" fill="#FFF2C6" fill-opacity="0.3"/>
    <circle cx="320" cy="420" r="12" fill="#FFF2C6" fill-opacity="0.2"/>

    <!-- Glass Highlights & Refraction -->
    <path d="M210,210 L390,210 C415,210 435,230 435,260 L430,420 C430,455 405,475 370,475 L230,475 C195,475 170,455 170,420 L165,260 C165,230 185,210 210,210 Z" fill="url(#jarGlass)"/>
    <path d="M185,250 L188,435" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" stroke-opacity="0.6"/>
    <path d="M196,255 L198,420" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round" stroke-opacity="0.4"/>

    <!-- Minimalist Heritage Label -->
    <rect x="220" y="300" width="160" height="110" rx="8" fill="url(#labelBg)" stroke="#C89B48" stroke-width="1.5"/>
    <rect x="225" y="305" width="150" height="100" rx="6" fill="none" stroke="#2A1810" stroke-width="0.75" stroke-dasharray="3 3"/>

    <!-- Label Typography -->
    <text x="300" y="335" font-family="'Plus Jakarta Sans', -apple-system, sans-serif" font-size="11" font-weight="700" letter-spacing="3" fill="#8F631D" text-anchor="middle">US BENGOL</text>
    <text x="300" y="365" font-family="'Plus Jakarta Sans', serif" font-size="22" font-weight="800" fill="#2A1810" text-anchor="middle">PURE GHEE</text>
    <text x="300" y="388" font-family="'Noto Sans Bengali', sans-serif" font-size="13" font-weight="600" fill="#7A4E10" text-anchor="middle">খাঁটি গাওয়া ঘি</text>

    <!-- Jar Lid (Traditional Brass / Gold Threaded Cap) -->
    <rect x="200" y="182" width="200" height="32" rx="6" fill="url(#brassLid)" filter="url(#softShadow)"/>
    <line x1="205" y1="192" x2="395" y2="192" stroke="#FFFFFF" stroke-width="1" stroke-opacity="0.5"/>
    <line x1="205" y1="202" x2="395" y2="202" stroke="#704A0D" stroke-width="1.5" stroke-opacity="0.4"/>
    <rect x="220" y="172" width="160" height="12" rx="4" fill="url(#brassLid)"/>
  </g>

  <!-- Floating Badge Pill -->
  <g transform="translate(370, 110)">
    <rect width="145" height="34" rx="17" fill="#233D2D" filter="url(#softShadow)"/>
    <text x="72" y="21" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700" fill="#FDFBF7" letter-spacing="1" text-anchor="middle">100% PURE</text>
  </g>
</svg>
