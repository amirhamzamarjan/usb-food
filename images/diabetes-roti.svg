<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGlowD" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#FDFBF7"/>
      <stop offset="70%" stop-color="#F2EDE2"/>
      <stop offset="100%" stop-color="#E5DC Flora"/>
    </radialGradient>
    <radialGradient id="rotiTexture" cx="45%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#DFCFB7"/>
      <stop offset="40%" stop-color="#CEBB9E"/>
      <stop offset="75%" stop-color="#B69E7B"/>
      <stop offset="100%" stop-color="#9C815D"/>
    </radialGradient>
    <linearGradient id="terracottaPlate" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F5EFEB"/>
      <stop offset="100%" stop-color="#E3D5C8"/>
    </linearGradient>
    <filter id="rotiShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#2A1810" flood-opacity="0.14"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="600" height="600" rx="32" fill="#FAF6EE"/>

  <!-- Subtle Earthen Plate / Mat -->
  <ellipse cx="300" cy="320" r="230" fill="none" stroke="#D9C9B0" stroke-width="2" stroke-dasharray="8 8"/>
  <circle cx="300" cy="320" r="215" fill="url(#terracottaPlate)" filter="url(#rotiShadow)"/>
  <circle cx="300" cy="320" r="200" fill="#EFE8DC"/>

  <!-- Roti Stack / Dietary Roti -->
  <!-- Bottom Roti -->
  <g filter="url(#rotiShadow)">
    <path d="M150,335 C145,260 210,195 295,190 C380,185 450,240 455,325 C460,410 395,470 310,475 C225,480 155,410 150,335 Z" fill="#B39B78" opacity="0.6"/>
  </g>

  <!-- Top Roti with Multi-Grain Specks & Soft Brown Flecks -->
  <g filter="url(#rotiShadow)">
    <path d="M140,310 C135,230 205,160 295,155 C385,150 460,210 465,300 C470,390 400,455 310,460 C220,465 145,390 140,310 Z" fill="url(#rotiTexture)"/>

    <!-- Natural Roasted Brown Flecks (Tawa Marks) -->
    <ellipse cx="230" cy="230" rx="14" ry="9" fill="#755633" opacity="0.4" transform="rotate(15 230 230)"/>
    <ellipse cx="350" cy="220" rx="18" ry="11" fill="#6B4D2B" opacity="0.45" transform="rotate(-20 350 220)"/>
    <ellipse cx="290" cy="290" rx="22" ry="13" fill="#84633D" opacity="0.35"/>
    <ellipse cx="200" cy="320" rx="12" ry="8" fill="#5F4224" opacity="0.38" transform="rotate(35 200 320)"/>
    <ellipse cx="380" cy="340" rx="25" ry="14" fill="#7A5832" opacity="0.42" transform="rotate(10 380 340)"/>
    <ellipse cx="270" cy="380" rx="16" ry="10" fill="#634526" opacity="0.35" transform="rotate(-15 270 380)"/>
    <ellipse cx="340" cy="400" rx="12" ry="7" fill="#7E5C38" opacity="0.3"/>

    <!-- High Fiber Multigrain Seed Accents (Methi, Chia/Flax, Barley flecks) -->
    <circle cx="260" cy="205" r="3" fill="#42301C" opacity="0.6"/>
    <circle cx="320" cy="185" r="2.5" fill="#42301C" opacity="0.6"/>
    <circle cx="390" cy="260" r="3" fill="#42301C" opacity="0.6"/>
    <circle cx="185" cy="275" r="3.5" fill="#42301C" opacity="0.55"/>
    <circle cx="230" cy="360" r="2.5" fill="#42301C" opacity="0.6"/>
    <circle cx="325" cy="330" r="3" fill="#42301C" opacity="0.65"/>
    <circle cx="410" cy="310" r="2.5" fill="#42301C" opacity="0.5"/>
  </g>

  <!-- Special Dietary Badge Indicator -->
  <g transform="translate(340, 95)">
    <rect width="195" height="36" rx="18" fill="#233D2D" filter="url(#rotiShadow)"/>
    <circle cx="20" cy="18" r="6" fill="#89C482"/>
    <text x="105" y="22" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700" fill="#FDFBF7" letter-spacing="1" text-anchor="middle">DIETARY CHOICE</text>
  </g>
</svg>
