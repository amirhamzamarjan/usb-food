<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <linearGradient id="sackBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EADBCE"/>
      <stop offset="50%" stop-color="#D9C4B0"/>
      <stop offset="100%" stop-color="#C5AD96"/>
    </linearGradient>
    <linearGradient id="wheatGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#DCAE5B"/>
      <stop offset="100%" stop-color="#A57A27"/>
    </linearGradient>
    <filter id="packShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="16" flood-color="#2A1810" flood-opacity="0.16"/>
    </filter>
  </defs>

  <rect width="600" height="600" rx="32" fill="#FAF6F0"/>
  <circle cx="300" cy="300" r="210" fill="#F0E5D4" opacity="0.6"/>

  <!-- Pouch / Sack -->
  <g filter="url(#packShadow)">
    <path d="M190,170 L410,170 C435,170 445,190 440,240 L425,445 C420,475 395,490 365,490 L235,490 C205,490 180,475 175,445 L160,240 C155,190 165,170 190,170 Z" fill="url(#sackBg)"/>

    <!-- Top Seal Crinkles -->
    <path d="M180,170 C230,180 370,180 420,170 L415,195 C370,205 230,205 185,195 Z" fill="#BFA78E"/>

    <!-- Kraft Paper Label -->
    <rect x="205" y="240" width="190" height="180" rx="10" fill="#FAF5ED" stroke="#B89248" stroke-width="1.5"/>
    <rect x="212" y="247" width="176" height="166" rx="8" fill="none" stroke="#634526" stroke-width="0.75" stroke-dasharray="3 3"/>

    <!-- Wheat Spike Artwork -->
    <path d="M300,265 L300,310 M300,270 L288,260 M300,270 L312,260 M300,282 L286,272 M300,282 L314,272 M300,294 L288,284 M300,294 L312,284" stroke="#A57A27" stroke-width="2" stroke-linecap="round"/>

    <!-- Typography -->
    <text x="300" y="335" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="700" letter-spacing="3" fill="#8C651F" text-anchor="middle">US BENGOL</text>
    <text x="300" y="362" font-family="'Plus Jakarta Sans', serif" font-size="20" font-weight="800" fill="#2E1B10" text-anchor="middle">WHOLE ATTA</text>
    <text x="300" y="384" font-family="'Noto Sans Bengali', sans-serif" font-size="14" font-weight="700" fill="#6B4515" text-anchor="middle">খাটি লাল আটা</text>
    <text x="300" y="402" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="600" fill="#887360" text-anchor="middle">STONE-GROUND STYLE</text>
  </g>

  <!-- Floating Badge -->
  <g transform="translate(360, 110)">
    <rect width="150" height="34" rx="17" fill="#8F5E24" filter="url(#packShadow)"/>
    <text x="75" y="21" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700" fill="#FFFFFF" letter-spacing="1" text-anchor="middle">100% WHOLE WHEAT</text>
  </g>
</svg>
